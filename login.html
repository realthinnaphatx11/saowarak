<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Our Love Story</title>
<meta name="theme-color" content="#FFF3F7">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Cdefs%3E%3ClinearGradient%20id='g'%20x1='0'%20y1='0'%20x2='1'%20y2='1'%3E%3Cstop%20offset='0'%20stop-color='%23FF6FA5'/%3E%3Cstop%20offset='1'%20stop-color='%23FF9F5A'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle%20cx='32'%20cy='32'%20r='30'%20fill='%23FFF0F5'/%3E%3Cpath%20d='M32%2050C32%2050%2010%2036%2010%2021C10%2013%2016%208%2022%208C26%208%2030%2010%2032%2014C34%2010%2038%208%2042%208C48%208%2054%2013%2054%2021C54%2036%2032%2050%2032%2050Z'%20fill='url(%23g)'/%3E%3C/svg%3E">
<script>
(function () {
  try {
    var s = localStorage.getItem('theme_mode');
    var d = s ? s === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (d) document.documentElement.classList.add('dark');
  } catch (e) {}
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500&family=Prompt:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: linear-gradient(160deg, #FFF3F7 0%, #FFF6EC 55%, #F6F0FC 100%); --bgsolid: #FFE8F1; --wall: rgba(255,182,193,.16);
    --text: #4A3E3D; --muted: #9A8B8A; --line: #F2C9D8; --field: #FFF8FB; --hover: rgba(255,111,165,.1);
    --accent: #FF6FA5; --err: #D9304F; --ring: #A374DB;
  }
  html.dark {
    color-scheme: dark;
    --bg: linear-gradient(160deg, #1F1426 0%, #241B22 55%, #1E1A2F 100%); --bgsolid: #1F1426; --wall: rgba(255,143,184,.05);
    --text: #F3E8EC; --muted: #B8A7B2; --line: rgba(255,143,184,.3); --field: rgba(255,143,184,.08); --hover: rgba(255,143,184,.14);
    --accent: #FF8FB8; --err: #FF8A9F;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body { font-family: 'Prompt', sans-serif; color: var(--text); background: var(--bg) fixed; min-height: 100vh; min-height: 100dvh; }

  .split { display: grid; grid-template-columns: 1.1fr 1fr; min-height: 100vh; min-height: 100dvh; transition: opacity .4s, transform .4s; }
  .split.out { opacity: 0; transform: scale(.98); }

  /* ฝั่งซ้าย: รูปในโปสเตอร์ติดผนัง */
  .wall { display: flex; align-items: center; justify-content: center; padding: 2.5rem 2rem; background: var(--wall); }
  .poster {
    position: relative; margin: 0; display: flex; flex-direction: column; padding: .9rem .9rem 0;
    width: min(100%, calc((100vh - 5rem) * .714)); width: min(100%, calc((100dvh - 5rem) * .714));
    aspect-ratio: 5 / 7; background: #FFFCF8; color: #4A3E3D; transform: perspective(900px) rotate(-1deg) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); transition: transform .25s ease-out;
    box-shadow: 0 18px 40px rgba(120,60,80,.22), 0 2px 6px rgba(120,60,80,.12);
  }
  .pic { flex: 1; min-height: 0; overflow: hidden; background: #EBD9DF; }
  .pic { position: relative; }
  .pic .slide { position: absolute; inset: 0; display: block; width: 100%; height: 100%; object-fit: cover; opacity: 0; transform: scale(1); transition: opacity 1.2s ease, transform 0s 1.2s; image-rendering: auto; }
  .pic .slide.on.ld { opacity: 1; transform: scale(1.08); transition: opacity 1.2s ease, transform 6s linear; }
  .poster figcaption { padding: .6rem 0 .8rem; text-align: center; }
  .cap-t { font: 500 clamp(1.35rem, 2.1vw, 1.9rem)/1.2 'Mitr', sans-serif; letter-spacing: .02em;
    background: linear-gradient(100deg, transparent 40%, rgba(255,255,255,.7) 50%, transparent 60%) no-repeat, linear-gradient(90deg, #F0518F, #D946EF, #F59E0B);
    background-size: 250% 100%, 100% 100%; background-position: 100% 0, 0 0; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shine 7s ease-in-out infinite; }
  @keyframes shine { 0%, 55% { background-position: 100% 0, 0 0; } 100% { background-position: 0% 0, 0 0; } }
  .tape { position: absolute; top: -.55rem; width: 3.4rem; height: 1.2rem; background: rgba(255,182,193,.7); }
  .tape.l { left: -.9rem; transform: rotate(-38deg); }
  .tape.r { right: -.9rem; transform: rotate(38deg); background: rgba(253,224,130,.75); }

  /* ฝั่งขวา: ปลดล็อก */
  .panel { position: relative; display: flex; align-items: center; justify-content: center; padding: 2rem 1.5rem calc(2rem + env(safe-area-inset-bottom)); }
  .box { width: 100%; max-width: 22rem; text-align: center; }
  .box.shake { animation: shake .4s; }
  @keyframes shake { 20%{transform:translateX(-8px)} 40%{transform:translateX(7px)} 60%{transform:translateX(-5px)} 80%{transform:translateX(3px)} }
  .step { display: none; }
  .step.on { display: block; animation: in .35s ease; }
  @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .heart { display: block; margin: 0 auto 1rem; animation: beat 2.5s infinite; }
  @keyframes beat { 0%{transform:scale(1)} 14%{transform:scale(1.14)} 28%{transform:scale(1)} 42%{transform:scale(1.14)} 70%{transform:scale(1)} }
  h1 { font: 500 1.2rem 'Mitr', sans-serif; margin: 0 0 .3rem; }
  .sub { font-size: .82rem; color: var(--muted); margin: 0 0 1.5rem; line-height: 1.55; }
  .msg { min-height: 1.3rem; font-size: .8rem; color: var(--muted); margin: .7rem 0 1rem; }
  .msg.err { color: var(--err); }

  /* PIN */
  .dots { display: flex; justify-content: center; gap: .9rem; margin: 1.6rem 0 .2rem; }
  .dot { width: .8rem; height: .8rem; border-radius: 50%; border: 1.5px solid var(--line); transition: background .12s, border-color .12s, transform .12s; }
  .dot.on { background: var(--accent); border-color: var(--accent); transform: scale(1.1); }
  .dots.bad .dot { border-color: var(--err); background: var(--err); }
  .pad { display: grid; grid-template-columns: repeat(3, 4.25rem); gap: 1rem 1.25rem; justify-content: center; }
  .key { width: 4.25rem; height: 4.25rem; border-radius: 50%; border: 1px solid var(--line); background: transparent; color: var(--text); font: 400 1.5rem 'Mitr', sans-serif; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background .12s, transform .08s; }
  .key:hover, .key:active { background: var(--hover); }
  .key:active { transform: scale(.94); }
  .key.ghost { border-color: transparent; }
  .key.blank { visibility: hidden; }
  .key:disabled { opacity: .5; cursor: default; }

  /* captcha popup (สไตล์ reCAPTCHA) */
  .rc-back { position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; padding: 1rem; background: rgba(0,0,0,.5); opacity: 0; visibility: hidden; transition: opacity .2s, visibility .2s; }
  .rc-back.on { opacity: 1; visibility: visible; }
  .rc { width: 400px; max-width: 100%; background: #fff; color: #202124; border-radius: 4px; box-shadow: 0 4px 24px rgba(0,0,0,.35); overflow: hidden; text-align: left; font-family: 'Prompt', Roboto, Arial, sans-serif; transform: translateY(10px) scale(.97); transition: transform .2s; }
  .rc-back.on .rc { transform: none; }
  .rc.shake { animation: shake .4s; }
  .rc-head { background: #1a73e8; color: #fff; padding: 1.1rem 1.25rem; line-height: 1.25; }
  .rc-head small { display: block; font-size: .85rem; }
  .rc-head b { display: block; font: 500 1.7rem/1.2 'Mitr', sans-serif; margin: .1rem 0; }
  .rc-body { padding: 8px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
  .tile { position: relative; aspect-ratio: 1; padding: 0; border: 0; border-radius: 0; overflow: hidden; cursor: pointer; background: #f1f3f4; }
  .tile img, .tile .ph { width: 100%; height: 100%; object-fit: cover; display: flex; align-items: center; justify-content: center; transition: transform .12s; }
  .tile .ph { color: #f2b3c9; background: #fdeef4; }
  .tile.sel img, .tile.sel .ph { transform: scale(.8); }
  .tile .ck { position: absolute; top: 6px; left: 6px; width: 22px; height: 22px; border-radius: 50%; background: #1a73e8; color: #fff; display: flex; align-items: center; justify-content: center; opacity: 0; transform: scale(.4); transition: opacity .12s, transform .12s; }
  .tile .ck svg { width: 14px; height: 14px; }
  .tile.sel .ck { opacity: 1; transform: none; }
  .rc-msg { min-height: 1.3rem; padding: 0 .9rem; font-size: .8rem; color: #d93025; }
  .rc-foot { display: flex; align-items: center; justify-content: space-between; gap: .5rem; padding: .6rem .6rem .6rem .5rem; border-top: 1px solid #dadce0; }
  .rc-ico { width: 2.4rem; height: 2.4rem; border: 0; border-radius: 50%; background: transparent; color: #5f6368; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .rc-ico:hover { background: rgba(0,0,0,.06); }
  .rc-go { padding: .65rem 1.4rem; border: 0; border-radius: 3px; background: #1a73e8; color: #fff; font: 500 .9rem 'Prompt', Roboto, sans-serif; letter-spacing: .04em; cursor: pointer; }
  .rc-go:hover { background: #1765cc; } .rc-go:disabled { opacity: .6; cursor: default; }
  .rc-ico:focus-visible, .rc-go:focus-visible, .tile:focus-visible { outline: 2px solid #1a73e8; outline-offset: 2px; }
  html.dark .rc { background: #222; color: #e8eaed; }
  html.dark .rc-foot { border-top-color: #444; } html.dark .rc-ico { color: #bdc1c6; } html.dark .rc-ico:hover { background: rgba(255,255,255,.1); }
  html.dark .tile { background: #333; } html.dark .tile .ph { background: #3a2a33; color: #a05d78; } html.dark .rc-msg { color: #f28b82; }
  .btn { width: 100%; padding: .8rem 1rem; border: 0; border-radius: 999px; cursor: pointer; font: 500 1rem 'Mitr', sans-serif; color: #fff; background: linear-gradient(90deg, #F0518F, #F2802E); transition: transform .1s, opacity .15s; }
  .btn:active { transform: scale(.98); }
  .btn:disabled { opacity: .6; cursor: default; }
  .btn:focus-visible, .key:focus-visible, .toggle:focus-visible { outline: 2px solid var(--ring); outline-offset: 3px; }

  .toggle { position: absolute; top: .9rem; right: .9rem; width: 2.25rem; height: 2.25rem; border: 0; border-radius: 50%; background: transparent; color: var(--muted); cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .toggle:hover { background: var(--hover); }
  .toggle .sun { display: none; } html.dark .toggle .sun { display: block; } html.dark .toggle .moon { display: none; }

  /* ===== effects ===== */
  .box { position: relative; z-index: 1; } .toggle { z-index: 2; }
  /* หัวใจ/กลีบลอย */
  .floaty { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
  .fl { position: absolute; left: var(--x); bottom: -2.5rem; width: var(--s); height: var(--s); color: var(--accent); opacity: 0; animation: rise var(--d) linear var(--dl) infinite; }
  .fl svg { display: block; width: 100%; height: 100%; }
  .fl.petal { border-radius: 150% 0 150% 0; background: linear-gradient(135deg, #FFB6CE, #FF8FB8); }
  @keyframes rise { 0% { transform: translate3d(0,0,0) rotate(0); opacity: 0; } 10%, 90% { opacity: var(--o); } 100% { transform: translate3d(var(--dx), -115vh, 0) rotate(var(--r)); opacity: 0; } }
  /* จุดบอกสไลด์ */
  .sdots { position: absolute; left: 0; right: 0; bottom: .45rem; display: flex; justify-content: center; gap: .1rem; z-index: 2; }
  .sdots button { width: 1.2rem; height: 1.2rem; padding: 0; border: 0; background: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .sdots button::before { content: ''; width: .45rem; height: .45rem; border-radius: 99px; background: rgba(255,255,255,.65); box-shadow: 0 0 0 1px rgba(0,0,0,.2); transition: width .25s, background .25s; }
  .sdots button.on::before { width: 1.1rem; background: #fff; }
  .sdots button:focus-visible { outline: 2px solid var(--ring); outline-offset: 1px; }
  /* ripple ปุ่มเลข */
  .key { position: relative; overflow: hidden; }
  .rip { position: absolute; border-radius: 50%; background: var(--accent); opacity: .35; transform: scale(0); animation: rip .55s ease-out forwards; pointer-events: none; }
  @keyframes rip { to { transform: scale(1); opacity: 0; } }
  /* ฉลอง PIN ถูก */
  .dots { position: relative; }
  .dots.ok .dot { background: var(--accent); border-color: var(--accent); animation: okpop .5s ease both; }
  @keyframes okpop { 0% { transform: scale(1.1); box-shadow: 0 0 0 0 rgba(255,111,165,.6); } 50% { transform: scale(1.7); } 100% { transform: scale(1.1); box-shadow: 0 0 0 10px rgba(255,111,165,0); } }
  .burst { position: absolute; left: 50%; top: 50%; pointer-events: none; animation: fly .8s ease-out both; }
  @keyframes fly { from { transform: translate(-50%,-50%) scale(.3); opacity: 1; } to { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1); opacity: 0; } }
  /* captcha tile */
  .tile { animation: tileIn .38s cubic-bezier(.2,.8,.3,1) both; }
  @keyframes tileIn { from { opacity: 0; transform: scale(.8); } }

  /* แอนิเมชันเข้าหน้าหลัก */
  #go { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; background: var(--bg); opacity: 0; visibility: hidden; transition: opacity .5s; overflow: hidden; }
  #go.on { opacity: 1; visibility: visible; }
  #go svg { width: 5rem; height: 5rem; animation: beat 1s infinite; }
  #go path { fill: var(--accent); transition: fill .9s; }
  #go.zoom svg { animation: none; transform: scale(45); transition: transform .9s cubic-bezier(.65,0,.9,.5); }
  #go.zoom path { fill: var(--bgsolid); }

  @media (max-width: 800px) {
    .split { grid-template-columns: 1fr; grid-template-rows: 40vh 1fr; grid-template-rows: 40dvh 1fr; }
    .wall { padding: 1.4rem 1rem; }
    .poster { width: min(100%, calc((40vh - 2.8rem) * .714)); width: min(100%, calc((40dvh - 2.8rem) * .714)); padding: .55rem .55rem 0; }
    .poster figcaption { padding: .3rem 0 .45rem; } .cap-t { font-size: 1.25rem; }
    .tape { width: 2.4rem; height: .9rem; }
    .panel { align-items: flex-start; padding-top: 2rem; }
  }
  @media (max-height: 640px) { .pad { gap: .6rem 1.1rem; grid-template-columns: repeat(3, 3.6rem); } .key { width: 3.6rem; height: 3.6rem; font-size: 1.3rem; } }
  @media (prefers-reduced-motion: reduce) { .heart, #go svg, .step.on, .box.shake, .rc.shake { animation: none; } .rc, .rc-back { transition: none; } #go.zoom svg { transition: none; } .dot, .key { transition: none; } }
  @media (prefers-reduced-motion: reduce) { .floaty { display: none; } .fl, .burst, .tile, .cap-t, .dots.ok .dot, .rip { animation: none; } .poster { transition: none; } .pic .slide.on.ld { transform: none; } }
</style>
</head>
<body>

<div class="split" id="split">
  <div class="wall">
    <figure class="poster">
      <i class="tape l"></i><i class="tape r"></i>
      <div class="pic" id="pic">
        <img class="slide on" src="images/login-1.jpg" alt="เรานั่งเล่นกับลูกแกะในสวน" style="object-position:50% 50%">
        <img class="slide" src="images/login-2.jpg" alt="เราสองคนยืนข้างกัน" style="object-position:50% 30%" loading="lazy">
        <img class="slide" src="images/login-3.jpg" alt="เซลฟี่ในรถกับน้องหมา" style="object-position:42% 50%" loading="lazy">
      </div>
      <figcaption>
        <div class="cap-t">Our Love Story</div>
        
      </figcaption>
    </figure>
  </div>

  <section class="panel">
    <button class="toggle" id="themeBtn" type="button" aria-label="สลับโหมดสว่าง/มืด">
      <svg class="moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>

    <div class="box" id="box">
      <!-- ขั้นที่ 1: PIN -->
      <div class="step on" id="s1">
        <svg class="heart" width="34" height="34" viewBox="0 0 24 24" fill="#FF6FA5" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg>
        <h1>ใส่รหัสผ่าน</h1>
        <p class="sub">วันที่เราเริ่มคบกัน เรียงเป็น วัน เดือน ปี (6 หลัก)</p>
        <div class="dots" id="dots" role="img" aria-label="กรอกแล้ว 0 จาก 6 หลัก"><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i></div>
        <p class="msg" id="m1" role="alert" aria-live="polite"></p>
        <div class="pad" id="pad">
          <button class="key" type="button" data-k="1">1</button><button class="key" type="button" data-k="2">2</button><button class="key" type="button" data-k="3">3</button>
          <button class="key" type="button" data-k="4">4</button><button class="key" type="button" data-k="5">5</button><button class="key" type="button" data-k="6">6</button>
          <button class="key" type="button" data-k="7">7</button><button class="key" type="button" data-k="8">8</button><button class="key" type="button" data-k="9">9</button>
          <button class="key blank" type="button" tabindex="-1" aria-hidden="true"></button>
          <button class="key" type="button" data-k="0">0</button>
          <button class="key ghost" type="button" data-k="del" aria-label="ลบ"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5H9l-6 7 6 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/><path d="M17 9.5l-5 5M12 9.5l5 5"/></svg></button>
        </div>
      </div>
    </div>
  </section>
</div>

<!-- captcha popup: เด้งทับหน้า PIN (หน้า PIN ยังอยู่ด้านหลัง) -->
<div class="rc-back" id="rcBack" aria-hidden="true">
  <div class="rc" id="rc" role="dialog" aria-modal="true" aria-labelledby="rcT">
    <div class="rc-head"><small>จากรูปทั้งหมด</small><b id="rcT">เลือก 3 รูป</b><small>แล้วกดยืนยัน</small></div>
    <div class="rc-body"><div class="grid" id="grid"></div></div>
    <p class="rc-msg" id="m2" role="alert" aria-live="polite"></p>
    <div class="rc-foot">
      <button class="rc-ico" id="rcRefresh" type="button" aria-label="ขอรูปชุดใหม่" title="ขอรูปชุดใหม่"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg></button>
      <button class="rc-go" id="verify" type="button">ยืนยัน</button>
    </div>
  </div>
</div>

<div id="go" aria-hidden="true">
  <svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg>
</div>

<script>
(function () {
  var AUTH_KEY = 'anniv_auth', REDIRECT = 'index.html', LEN = 6;

  // ===== รูปสำหรับ captcha (3x3 = 9 ช่อง) =====
  // cute: true = ต้องเลือก (3 รูปแรก), false = ห้ามเลือก
  // ตำแหน่งจะถูกสุ่มสลับใหม่ทุกครั้งที่เปิด captcha / กดรีเฟรช / ตอบผิด
  var CAPTCHA_TILES = [
    { src: 'captcha/nan1.jpg', cute: true },
    { src: 'captcha/nan2.jpg', cute: true },
    { src: 'captcha/nan3.jpg', cute: true },
    { src: 'captcha/nan4.jpg', cute: false },
    { src: 'captcha/nan5.jpg', cute: false },
    { src: 'captcha/nan6.jpg', cute: false },
    { src: 'captcha/nan7.jpg', cute: false },
    { src: 'captcha/nan8.jpg', cute: false },
    { src: 'captcha/nan9.jpg', cute: false }
  ];
  var current = CAPTCHA_TILES.slice(); // ลำดับที่แสดงอยู่ตอนนี้ (หลังสุ่ม)
  function shuffle(a) { // Fisher-Yates ด้วย crypto random
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j;
      if (window.crypto && crypto.getRandomValues) { var r = new Uint32Array(1); crypto.getRandomValues(r); j = r[0] % (i + 1); }
      else j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  var settings = { startDate: '2023-01-09' };
  try { Object.assign(settings, JSON.parse(localStorage.getItem('couple_settings_data') || '{}')); } catch (e) {}
  var p = settings.startDate.split('-');                       // [ค.ศ., เดือน, วัน]
  var two = function (n) { return String(n).padStart(2, '0'); };
  var dm = two(p[2]) + two(p[1]);
  var okCodes = [dm + String(p[0]).slice(-2), dm + two((+p[0] + 543) % 100)]; // ปีท้ายสองหลัก ค.ศ. หรือ พ.ศ.

  var $ = function (id) { return document.getElementById(id); };
  var box = $('box'), dots = $('dots'), dotEls = dots.querySelectorAll('.dot');
  var code = '', fails = 0, locked = false, stage = 1;
  function say(el, t, err) { el.textContent = t; el.className = 'msg' + (err ? ' err' : ''); }
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var HP = 'M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z';
  function celebrate() {
    dots.classList.add('ok');
    if (navigator.vibrate) navigator.vibrate([20, 50, 20]);
    if (reduced) return;
    dotEls.forEach(function (d, i) { d.style.animationDelay = i * 70 + 'ms'; });
    var cols = ['#FF6FA5', '#D946EF', '#F59E0B', '#F0518F'];
    for (var n = 0; n < 14; n++) {
      var h = document.createElement('span'), a = n / 14 * Math.PI * 2 + Math.random() * .4, r = 50 + Math.random() * 60, z = 12 + Math.floor(Math.random() * 10);
      h.className = 'burst'; h.style.color = cols[n % 4]; h.style.animationDelay = (150 + Math.random() * 150) + 'ms';
      h.style.setProperty('--dx', Math.cos(a) * r * 1.4 + 'px'); h.style.setProperty('--dy', Math.sin(a) * r + 'px');
      h.innerHTML = '<svg width="' + z + '" height="' + z + '" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="' + HP + '"/></svg>';
      dots.appendChild(h);
      (function (el) { setTimeout(function () { el.remove(); }, 1500); })(h);
    }
  }
  function ripple(btn, x, y) {
    if (!btn || reduced) return;
    var b = btn.getBoundingClientRect(), d = b.width * 1.7, el = document.createElement('span');
    el.className = 'rip';
    el.style.cssText = 'width:' + d + 'px;height:' + d + 'px;left:' + ((x == null ? b.width / 2 : x - b.left) - d / 2) + 'px;top:' + ((y == null ? b.height / 2 : y - b.top) - d / 2) + 'px';
    btn.appendChild(el); setTimeout(function () { el.remove(); }, 600);
  }
  function shake(el) { el = el || box; el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); if (navigator.vibrate) navigator.vibrate(120); }

  // --- ขั้นที่ 1: PIN ---
  function render() {
    dotEls.forEach(function (d, i) { d.classList.toggle('on', i < code.length); });
    dots.setAttribute('aria-label', 'กรอกแล้ว ' + code.length + ' จาก ' + LEN + ' หลัก');
  }
  function checkPin() {
    locked = true;
    if (okCodes.indexOf(code) > -1) { celebrate(); setTimeout(openCaptcha, reduced ? 250 : 1000); return; } // PIN ถูก: เด้ง popup ทับ ไม่ซ่อนหน้า PIN (locked ค้างไว้จนกว่าจะปิด popup)
    fails++; dots.classList.add('bad'); shake();
    say($('m1'), 'รหัสยังไม่ตรง ลองอีกครั้ง' + (fails >= 3 ? ' (ใบ้: เริ่มคบกันปี พ.ศ. ' + (+p[0] + 543) + ')' : ''), true);
    setTimeout(function () { code = ''; dots.classList.remove('bad'); render(); locked = false; }, 600);
  }
  function press(k) {
    if (locked || stage !== 1) return;
    if (k === 'del') { code = code.slice(0, -1); say($('m1'), ''); render(); return; }
    if (code.length >= LEN) return;
    code += k; say($('m1'), ''); render();
    if (code.length === LEN) setTimeout(checkPin, 140);
  }
  $('pad').addEventListener('pointerdown', function (e) {
    var b = e.target.closest('[data-k]');
    if (b && !locked && stage === 1) { ripple(b, e.clientX, e.clientY); if (navigator.vibrate) navigator.vibrate(8); }
  });
  $('pad').addEventListener('click', function (e) { var b = e.target.closest('[data-k]'); if (b) press(b.dataset.k); });
  document.addEventListener('keydown', function (e) {
    var k = /^\d$/.test(e.key) ? e.key : e.key === 'Backspace' ? 'del' : null;
    if (k === null) return;
    if (!locked && stage === 1) ripple($('pad').querySelector('[data-k="' + k + '"]'));
    press(k);
  });

  // --- ขั้นที่ 2: captcha ---
  var HEART = '<svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg>';
  var CHECK = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  var picked = [];
  function buildCaptcha() {
    var grid = $('grid'); grid.innerHTML = ''; picked = [];
    current = shuffle(CAPTCHA_TILES);
    current.forEach(function (t, i) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'tile'; b.style.animationDelay = (120 + i * 50) + 'ms'; b.setAttribute('aria-pressed', 'false'); b.setAttribute('aria-label', 'รูปที่ ' + (i + 1));
      var ph = '<span class="ph">' + HEART + '</span>';
      b.innerHTML = (t.src ? '<img src="' + t.src + '" alt="">' : ph) + '<span class="ck">' + CHECK + '</span>';
      var img = b.querySelector('img');
      if (img) img.onerror = function () { img.outerHTML = ph; };
      b.addEventListener('click', function () {
        picked[i] = !picked[i];
        b.classList.toggle('sel', picked[i]); b.setAttribute('aria-pressed', String(!!picked[i]));
        say($('m2'), '');
      });
      grid.appendChild(b);
    });
  }
  // --- popup: เปิด/ปิด ---
  var rcBack = $('rcBack');
  function openCaptcha() {
    stage = 2; buildCaptcha(); say($('m2'), '');
    rcBack.classList.add('on'); rcBack.setAttribute('aria-hidden', 'false'); $('verify').focus();
  }
  function closeCaptcha() { // ยกเลิก: กลับไปกรอก PIN ใหม่
    rcBack.classList.remove('on'); rcBack.setAttribute('aria-hidden', 'true');
    dots.classList.remove('ok'); code = ''; render(); say($('m1'), ''); stage = 1; locked = false;
  }
  rcBack.addEventListener('mousedown', function (e) { if (e.target === rcBack) closeCaptcha(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && stage === 2 && !$('verify').disabled) closeCaptcha(); });
  $('rcRefresh').addEventListener('click', function () { buildCaptcha(); say($('m2'), ''); });

  $('verify').addEventListener('click', function () {
    var ok = current.every(function (t, i) { return !!picked[i] === !!t.cute; });
    if (ok) { try { localStorage.setItem(AUTH_KEY, '1'); } catch (e) {} enter(); return; }
    shake($('rc')); say($('m2'), 'ยังเลือกไม่ครบ หรือเลือกไม่ถูก ลองใหม่ดูนะ', true); buildCaptcha();
  });

  // --- ขั้นที่ 3: แอนิเมชันเข้าหน้าหลัก ---
  function enter() {
    $('verify').disabled = true; $('rcRefresh').disabled = true; rcBack.classList.remove('on');
    var still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    $('split').classList.add('out'); $('go').classList.add('on');
    if (still) { setTimeout(function () { location.href = REDIRECT; }, 500); return; }
    setTimeout(function () { $('go').classList.add('zoom'); }, 1300);
    setTimeout(function () { location.href = REDIRECT; }, 2300);
  }

  $('themeBtn').addEventListener('click', function () {
    var d = document.documentElement.classList.toggle('dark');
    try { localStorage.setItem('theme_mode', d ? 'dark' : 'light'); } catch (e) {}
  });
})();
</script>
<script>
(function () {
  var pic = document.getElementById('pic'), poster = pic.parentNode, wall = poster.parentNode, panel = document.querySelector('.panel');
  var slides = pic.querySelectorAll('.slide'), reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // fade-in เมื่อรูปโหลดเสร็จ
  slides.forEach(function (im) {
    var ok = function () { im.classList.add('ld'); };
    if (im.complete && im.naturalWidth) ok(); else { im.addEventListener('load', ok); im.addEventListener('error', ok); }
  });

  // สไลด์ + จุดบอก + หยุดเมื่อ hover/แตะ + ปัดซ้ายขวา
  var cur = 0, timer = null, hold = false, btns = [], nav = document.createElement('div');
  nav.className = 'sdots';
  slides.forEach(function (_, n) {
    var b = document.createElement('button'); b.type = 'button'; b.setAttribute('aria-label', 'รูปที่ ' + (n + 1));
    b.addEventListener('click', function () { go(n); });
    nav.appendChild(b); btns.push(b);
  });
  if (slides.length > 1) pic.appendChild(nav);
  btns[0] && btns[0].classList.add('on');
  function stop() { clearInterval(timer); timer = null; }
  function run() { stop(); if (!reduced && !hold && !document.hidden && slides.length > 1) timer = setInterval(function () { go(cur + 1); }, 4500); }
  function go(n) {
    slides[cur].classList.remove('on'); btns[cur].classList.remove('on');
    cur = (n + slides.length) % slides.length;
    slides[cur].classList.add('on'); btns[cur].classList.add('on');
    run();
  }
  poster.addEventListener('mouseenter', function () { hold = true; stop(); });
  poster.addEventListener('mouseleave', function () { hold = false; run(); });
  var x0 = null;
  pic.addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; hold = true; stop(); }, { passive: true });
  pic.addEventListener('touchend', function (e) {
    var dx = e.changedTouches[0].clientX - x0; hold = false;
    if (Math.abs(dx) > 40) go(cur + (dx < 0 ? 1 : -1)); else run();
  }, { passive: true });
  document.addEventListener('visibilitychange', run);
  run();

  // โปสเตอร์เอียงตามเมาส์ (เฉพาะอุปกรณ์ที่มีเมาส์)
  if (!reduced && matchMedia('(hover: hover) and (pointer: fine)').matches) {
    wall.addEventListener('mousemove', function (e) {
      var w = wall.getBoundingClientRect();
      var x = (e.clientX - w.left) / w.width * 2 - 1, y = (e.clientY - w.top) / w.height * 2 - 1;
      poster.style.setProperty('--ry', (x * 7).toFixed(2) + 'deg'); poster.style.setProperty('--rx', (-y * 7).toFixed(2) + 'deg');
    });
    wall.addEventListener('mouseleave', function () { poster.style.setProperty('--ry', '0deg'); poster.style.setProperty('--rx', '0deg'); });
  }

  // หัวใจ/กลีบดอกไม้ลอยฝั่งขวา
  if (!reduced) {
    var fl = document.createElement('div'); fl.className = 'floaty'; fl.setAttribute('aria-hidden', 'true');
    for (var n = 0; n < 12; n++) {
      var e = document.createElement('i'), d = 14 + Math.random() * 14, petal = n % 3 === 2;
      e.className = 'fl' + (petal ? ' petal' : '');
      e.style.cssText = '--x:' + (Math.random() * 96) + '%;--s:' + (10 + Math.random() * 14) + 'px;--d:' + d + 's;--dl:-' + (Math.random() * d) + 's;--dx:' + ((Math.random() - .5) * 80) + 'px;--r:' + ((Math.random() - .5) * 360) + 'deg;--o:' + (.15 + Math.random() * .2);
      if (!petal) e.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg>';
      fl.appendChild(e);
    }
    panel.insertBefore(fl, panel.firstChild);
  }
})();
</script>
</body>
