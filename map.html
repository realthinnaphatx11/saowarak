<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>แผนที่ความทรงจำของเรา</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Mitr:wght@500;600;700&display=swap" rel="stylesheet">

<style>
    :root {
        --pink-fill: #FFD3E4;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: inherit; }
    html, body {
        margin: 0;
        height: 100%;
        font-family: 'Prompt', sans-serif;
        background: linear-gradient(150deg, #FFE8F1 0%, #FFF3E6 30%, #FFEFD9 55%, #F1E9FB 80%, #E4F6F2 100%);
        color: #4A3E3D;
        overflow: hidden;
    }
    header {
        text-align: center;
        padding: 14px 16px 10px;
        padding-top: calc(14px + env(safe-area-inset-top, 0px));
    }
    header h1 {
        font-family: 'Mitr', sans-serif;
        font-size: 1.25rem;
        margin: 0 0 3px;
        background: linear-gradient(90deg, #ec4899, #d946ef, #f59e0b);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
    }
    header p {
        font-size: 0.75rem;
        color: #9c7c7c;
        margin: 0;
    }

    #map-wrap {
        position: relative;
        width: 100%;
        height: calc(100vh - 100px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
        min-height: 400px;
        touch-action: none;
        overflow: hidden;
        background: radial-gradient(circle at 50% 30%, #ffffff 0%, #fff3f8 60%, #ffe9f2 100%);
    }
    svg#thmap {
        width: 100%;
        height: 100%;
        display: block;
        cursor: grab;
    }
    svg#thmap:active { cursor: grabbing; }

    .province {
        transition: fill 0.15s ease;
    }
    .province:hover, .province.touched {
        fill: #FF9FC1 !important;
    }
    .province-label {
        font-family: 'Prompt', sans-serif;
        font-weight: 500;
        font-size: 7px;
        fill: #7a3350;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease;
        paint-order: stroke;
        stroke: white;
        stroke-width: 0.6px;
    }

    .marker-pin { cursor: pointer; }
    .marker-pin .pin-shape {
        fill: #FF5B94;
        stroke: white;
        stroke-width: 2.4;
        vector-effect: non-scaling-stroke;
    }
    .marker-pin:hover .pin-shape { fill: #FF3D82; }

    /* --- Zoom controls --- */
    .zoom-controls {
        position: absolute;
        right: 14px;
        bottom: calc(14px + env(safe-area-inset-bottom, 0px));
        display: flex;
        flex-direction: column;
        gap: 8px;
        z-index: 10;
    }
    .zoom-btn {
        width: 40px;
        height: 40px;
        border-radius: 999px;
        background: white;
        border: 1.5px solid #ffd4e5;
        color: #db2777;
        font-size: 1.1rem;
        font-weight: 700;
        box-shadow: 0 4px 12px rgba(255,105,180,0.25);
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .zoom-btn:active { background: #fff0f5; }

    /* --- Selected location panel (bottom sheet) --- */
    #panel {
        position: absolute;
        left: 0; right: 0; bottom: 0;
        background: rgba(255,255,255,0.97);
        border-top: 2px solid #ffd4e5;
        border-radius: 20px 20px 0 0;
        box-shadow: 0 -8px 24px rgba(255,105,180,0.2);
        transform: translateY(100%);
        transition: transform 0.3s ease;
        max-height: 62%;
        overflow-y: auto;
        z-index: 20;
        padding: 14px 16px calc(16px + env(safe-area-inset-bottom, 0px));
    }
    #panel.open { transform: translateY(0); }
    #panel .drag-handle {
        width: 40px; height: 4px; border-radius: 2px;
        background: #ffd4e5; margin: 0 auto 10px;
    }
    #panel h3 {
        font-family: 'Mitr', sans-serif;
        color: #db2777;
        font-size: 1rem;
        margin: 0 0 10px;
        display: flex; align-items: center; gap: 6px;
    }
    #panel .close-btn {
        position: absolute; top: 12px; right: 14px;
        background: #fff0f5; border: 1px solid #ffd4e5; color: #db2777;
        width: 30px; height: 30px; border-radius: 999px;
        display: flex; align-items: center; justify-content: center;
        font-size: 0.9rem;
    }
    .memory-row {
        display: flex; gap: 10px; align-items: center;
        background: #fff8fb; border: 1px solid #ffe3ef;
        border-radius: 14px; padding: 8px; margin-bottom: 8px;
    }
    .memory-row .thumb {
        width: 52px; height: 52px; border-radius: 12px; object-fit: cover; flex-shrink: 0;
    }
    .memory-row .thumb-fallback {
        width: 52px; height: 52px; border-radius: 12px; flex-shrink: 0;
        background: #ffe3ef; display: flex; align-items: center; justify-content: center; font-size: 1.4rem;
    }
    .memory-row .info h4 { margin: 0 0 2px; font-size: 0.85rem; color: #1f2937; }
    .memory-row .info p { margin: 0; font-size: 0.72rem; color: #9ca3af; }
    .memory-row .story {
        font-size: 0.75rem; color: #4b5563; margin: 8px 0 0; line-height: 1.4;
    }

    #hint {
        position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
        background: rgba(255,255,255,0.9); border: 1px solid #ffd4e5; color: #9c7c7c;
        font-size: 0.7rem; padding: 5px 12px; border-radius: 999px; z-index: 10;
        pointer-events: none; transition: opacity 0.3s ease;
    }
    #unplaced-btn {
        display: none; position: absolute; top: 10px; right: 14px; z-index: 10;
        background: rgba(255,255,255,0.95); border: 1px solid #ffd4e5; color: #db2777;
        font-size: 0.7rem; padding: 6px 12px; border-radius: 999px;
        box-shadow: 0 4px 12px rgba(255,105,180,0.2);
    }
</style>
</head>

</div>

<script>
const IMAGES = {"temple-2023-01-11": "images/photo-5ef05729.jpg"};
const MAP_GROUPS = {"พระนครศรีอยุธยา": {"items": [{"title": "วัดแรกของเรา 2 คน", "date": "2023-01-11", "mood": "✈️", "imageId": "temple-2023-01-11", "story": "ทริปแรกด้วยกันที่อยุธยา พาเที่ยววัดใหญ่ชัยมงคล เดินขึ้นบันไดสูงๆ ไปดูเจดีย์เก่าแก่ที่อยู่คู่เมืองมานานหลายร้อยปี วันนั้นคนเยอะและอากาศไม่ค่อยดี เลยต้องใส่แมสก์กันทั้งคู่ แต่ก็ยังแอบถ่ายรูปคู่กันไว้เป็นที่ระลึก"}]}, "ประจวบคีรีขันธ์": {"items": [{"title": "เดทครบรอบ 1 ปี ที่ชายหาดหัวหิน 🌊", "date": "2024-02-14", "mood": "❤️", "imageId": null, "story": "เดินทางไปเที่ยวทะเลด้วยกัน ลมเย็นมากๆ เรากอดกันนั่งดูพระอาทิตย์ตกดินด้วยกัน ทานอาหารทะเลอร่อยสุดๆ เป็นวันที่มีความสุขมากๆ เลยนะ ❤️"}]}, "__unplaced__": {"items": [{"title": "เซอไพรส์วันเกิดครบรอบ 24 ปี 🎂", "date": "2024-06-10", "mood": "🥰", "imageId": null, "story": "แอบซื้อเค้กสตรอว์เบอร์รีที่คุณชอบที่สุดมาให้ตอนเที่ยงคืน เห็นรอยยิ้มของคุณแล้วเราก็มีความสุขตามไปด้วย"}, {"title": "ลองทำต้มยำกุ้งกินกันครั้งแรก 🍲", "date": "2024-09-01", "mood": "😋", "imageId": null, "story": "ช่วยกันเตรียมวัตถุดิบจนครัวเลอะเทอะไปหมด แม้รสชาติจะเปรี้ยวไปนิดหน่อย แต่มื้อนี้สนุกและอร่อยที่สุดเพราะเราทำด้วยกัน!"}]}};
const UNPLACED_COUNT = 2;

    // ---------------- Pan / Zoom ----------------
    const svg = document.getElementById('thmap');
    const FULL = { x: 0, y: 0, w: 324.0, h: 595.08 };
    let view = { ...FULL };
    const MIN_W = FULL.w * 0.16;   // most zoomed-in
    const MAX_W = FULL.w;          // fully zoomed-out (fit)
    const ZOOM_LABEL_THRESHOLD_W = FULL.w * 0.55; // start considering labels below this width

    let rafPending = false;
    function scheduleLabelUpdate() {
        if (rafPending) return;
        rafPending = true;
        requestAnimationFrame(() => {
            updateLabelVisibility();
            rafPending = false;
        });
    }

    function applyView() {
        svg.setAttribute('viewBox', `${view.x} ${view.y} ${view.w} ${view.h}`);
        const hint = document.getElementById('hint');
        if (hint) hint.style.opacity = view.w < MAX_W - 5 ? '0' : '1';
        scheduleLabelUpdate();
    }

    // Hide labels that would visually overlap at the current zoom/pan.
    // Bigger provinces (by rendered area) get priority to stay visible.
    const allLabels = Array.from(document.querySelectorAll('.province-label'))
        .sort((a, b) => parseFloat(b.dataset.area) - parseFloat(a.dataset.area));

    function updateLabelVisibility() {
        if (view.w >= ZOOM_LABEL_THRESHOLD_W) {
            allLabels.forEach(l => { l.style.opacity = '0'; });
            return;
        }
        const accepted = [];
        allLabels.forEach(l => {
            const rect = l.getBoundingClientRect();
            const padded = { left: rect.left - 2, right: rect.right + 2, top: rect.top - 1, bottom: rect.bottom + 1 };
            const overlaps = accepted.some(r =>
                !(padded.right < r.left || padded.left > r.right || padded.bottom < r.top || padded.top > r.bottom)
            );
            if (!overlaps && rect.width > 0) {
                l.style.opacity = '1';
                accepted.push(padded);
            } else {
                l.style.opacity = '0';
            }
        });
    }

    function clampView(v) {
        v.w = Math.max(MIN_W, Math.min(MAX_W, v.w));
        v.h = v.w * (FULL.h / FULL.w);
        v.x = Math.max(0, Math.min(FULL.w - v.w, v.x));
        v.y = Math.max(0, Math.min(FULL.h - v.h, v.y));
        return v;
    }

    function screenToSvgPoint(clientX, clientY) {
        const rect = svg.getBoundingClientRect();
        const scaleFitX = view.w / rect.width;
        const scaleFitY = view.h / rect.height;
        return {
            x: view.x + (clientX - rect.left) * scaleFitX,
            y: view.y + (clientY - rect.top) * scaleFitY
        };
    }

    function zoomAt(clientX, clientY, factor) {
        const before = screenToSvgPoint(clientX, clientY);
        const newW = view.w / factor;
        const newH = newW * (FULL.h / FULL.w);
        const ratioX = (before.x - view.x) / view.w;
        const ratioY = (before.y - view.y) / view.h;
        view.w = newW; view.h = newH;
        view.x = before.x - ratioX * view.w;
        view.y = before.y - ratioY * view.h;
        clampView(view);
        applyView();
    }

    svg.addEventListener('wheel', (e) => {
        e.preventDefault();
        const factor = e.deltaY < 0 ? 1.2 : 1 / 1.2;
        zoomAt(e.clientX, e.clientY, factor);
    }, { passive: false });

    const pointers = new Map();
    let panLast = null;
    let pinchStartDist = null;
    let pinchStartView = null;

    function dist(p1, p2) { return Math.hypot(p1.x - p2.x, p1.y - p2.y); }
    function midpoint(p1, p2) { return { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 }; }

    svg.addEventListener('pointerdown', (e) => {
        svg.setPointerCapture(e.pointerId);
        pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        if (pointers.size === 1) {
            panLast = { x: e.clientX, y: e.clientY };
        } else if (pointers.size === 2) {
            const pts = Array.from(pointers.values());
            pinchStartDist = dist(pts[0], pts[1]);
            pinchStartView = { ...view };
        }
    });

    svg.addEventListener('pointermove', (e) => {
        if (!pointers.has(e.pointerId)) return;
        pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

        if (pointers.size === 1 && panLast) {
            const rect = svg.getBoundingClientRect();
            const dxScreen = e.clientX - panLast.x;
            const dyScreen = e.clientY - panLast.y;
            const dxSvg = dxScreen * (view.w / rect.width);
            const dySvg = dyScreen * (view.h / rect.height);
            view.x -= dxSvg;
            view.y -= dySvg;
            clampView(view);
            applyView();
            panLast = { x: e.clientX, y: e.clientY };
        } else if (pointers.size === 2 && pinchStartDist) {
            const pts = Array.from(pointers.values());
            const newDist = dist(pts[0], pts[1]);
            const factor = newDist / pinchStartDist;
            const mid = midpoint(pts[0], pts[1]);
            const rect = svg.getBoundingClientRect();
            const beforeMid = {
                x: pinchStartView.x + ((mid.x - rect.left) * (pinchStartView.w / rect.width)),
                y: pinchStartView.y + ((mid.y - rect.top) * (pinchStartView.h / rect.height))
            };
            const ratioX = (beforeMid.x - pinchStartView.x) / pinchStartView.w;
            const ratioY = (beforeMid.y - pinchStartView.y) / pinchStartView.h;
            let newW = pinchStartView.w / factor;
            let newH = newW * (FULL.h / FULL.w);
            view.w = newW; view.h = newH;
            view.x = beforeMid.x - ratioX * view.w;
            view.y = beforeMid.y - ratioY * view.h;
            clampView(view);
            applyView();
        }
    });

    function endPointer(e) {
        pointers.delete(e.pointerId);
        if (pointers.size < 2) { pinchStartDist = null; }
        if (pointers.size < 1) { panLast = null; }
    }
    svg.addEventListener('pointerup', endPointer);
    svg.addEventListener('pointercancel', endPointer);
    svg.addEventListener('pointerleave', endPointer);

    document.getElementById('zoom-in').addEventListener('click', () => {
        const rect = svg.getBoundingClientRect();
        zoomAt(rect.left + rect.width / 2, rect.top + rect.height / 2, 1.4);
    });
    document.getElementById('zoom-out').addEventListener('click', () => {
        const rect = svg.getBoundingClientRect();
        zoomAt(rect.left + rect.width / 2, rect.top + rect.height / 2, 1 / 1.4);
    });
    document.getElementById('zoom-reset').addEventListener('click', () => {
        view = { ...FULL };
        applyView();
    });

    applyView();

    // Hydrate marker photo placeholders with their actual image data
    document.querySelectorAll('image[data-img-id]').forEach(el => {
        const id = el.getAttribute('data-img-id');
        if (IMAGES[id]) {
            el.setAttributeNS('http://www.w3.org/1999/xlink', 'href', IMAGES[id]);
            el.setAttribute('href', IMAGES[id]);
        }
    });

    if (UNPLACED_COUNT > 0) {
        document.getElementById('unplaced-count').textContent = UNPLACED_COUNT;
        const btn = document.getElementById('unplaced-btn');
        btn.style.display = 'inline-flex';
        btn.addEventListener('click', () => openPanelFor('__unplaced__'));
    }

    // ---------------- Panel ----------------
    function formatDateThai(dateStr) {
        const months = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
        const d = new Date(dateStr);
        return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear() + 543}`;
    }

    function openPanelFor(groupKey) {
        const group = MAP_GROUPS[groupKey];
        if (!group) return;
        const titleLabel = groupKey === '__unplaced__' ? 'ไม่ระบุจังหวัดชัดเจน' : groupKey;
        document.getElementById('panel-title').innerHTML = `📍 <span>${titleLabel}</span>`;
        document.getElementById('panel-body').innerHTML = group.items.map(m => {
            const imgSrc = m.imageId ? IMAGES[m.imageId] : null;
            return `
            <div class="memory-row">
                ${imgSrc ? `<img class="thumb" src="${imgSrc}">` : `<div class="thumb-fallback">${m.mood || '❤️'}</div>`}
                <div class="info">
                    <h4>${m.title}</h4>
                    <p>${formatDateThai(m.date)}</p>
                </div>
            </div>
            <p class="story">${m.story}</p>
        `;
        }).join('');
        document.getElementById('panel').classList.add('open');
    }
    function closePanel() {
        document.getElementById('panel').classList.remove('open');
    }

    document.querySelectorAll('.marker-pin').forEach(el => {
        el.addEventListener('click', (e) => {
            e.stopPropagation();
            openPanelFor(el.getAttribute('data-key'));
        });
    });
</script>
