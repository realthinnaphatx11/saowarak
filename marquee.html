        (function () {
            try {
                var s = localStorage.getItem('theme_mode');
                var d = s ? s === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (d) document.documentElement.classList.add('dark');
            } catch (e) {}
        })();

    <style>

        body {

            background: var(--bg);
            background-attachment: fixed;

        .content { flex: 1; display: flex; flex-direction: column; justify-content: center; }


        .page-head { text-align: center; padding: 2.5rem 1.25rem 1.5rem; }

        /* --- Marquee --- */
        .marquee {
            overflow: hidden; padding: 1rem 0 2rem;
            -webkit-mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
                    mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
        }
        .track {
            display: flex; width: max-content;
            animation: scroll var(--dur, 60s) linear infinite;

        /* หยุดตอนเอาเมาส์ชี้ เฉพาะอุปกรณ์ที่มีเมาส์จริง (บนมือถือ :hover จะค้างหลังแตะ ทำให้หยุดเลื่อน) */
        @media (hover: hover) and (pointer: fine) {
            .marquee:hover .track { animation-play-state: paused; }

        .track { will-change: transform; }
        .group { display: flex; gap: 1.75rem; padding-right: 1.75rem; }
        @keyframes scroll { to { transform: translateX(-50%); } }

        figure { margin: 0; width: clamp(170px, 22vw, 250px); text-align: center; flex: none; }
        .photo {

        .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }

        figcaption small { display: block; margin-top: .15rem; font: 300 .8rem 'Prompt', sans-serif; color: var(--muted); }

    <!-- Firebase: ตัวเดียวกับหน้าหลัก ต้องวางไฟล์ไว้โฟลเดอร์เดียวกัน -->
    <script src="./firebase-config.js"></script>
    <script>window.firebaseConfig = firebaseConfig;</script>
    <script type="module" src="./firebase-app.js"></script>

    <script>
        const MIN_ITEMS = 12; // ถ้ารูปน้อย จะเอามาทำซ้ำให้เต็มจอ ไม่ให้เลื่อนแล้วโล่ง
        const SECONDS_PER_ITEM = 5; // ยิ่งเลขมาก ยิ่งเลื่อนช้า

        function escapeHtml(s) {
            return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }
        function formatDateThai(str) {
            const d = new Date(str);
            if (isNaN(d.getTime())) return str || '';
            const m = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
            return `${d.getDate()} ${m[d.getMonth()]} ${d.getFullYear() + 543}`;
        }

        function waitForFirebase() {
            return new Promise(resolve => {
                if (window.firestoreApi) return resolve();
                window.addEventListener('firebase-ready', resolve, { once: true });
            });
        }

        // เอารูปทุกรูปจากทุกเหตุการณ์ (เรียงตามวันที่เก่า -> ใหม่)
        function collectPhotos(memories) {
            const sorted = [...memories].sort((a, b) => new Date(a.date) - new Date(b.date));
            const photos = [];
            sorted.forEach(m => {
                const imgs = m.images || (m.image ? [m.image] : []);
                imgs.forEach(src => photos.push({ src, title: m.title, date: m.date }));
            });
            return photos;
        }

        function render(photos) {
            const track = document.getElementById('track');
            const subtitle = document.getElementById('subtitle');

            if (photos.length === 0) {
                document.getElementById('marquee').innerHTML =
                    '<div class="state">ยังไม่มีรูปในความทรงจำเลย ลองเพิ่มรูปที่หน้าไทม์ไลน์ก่อนนะ 💗</div>';
                subtitle.textContent = 'ยังไม่มีรูป';
                return;
            }

            subtitle.textContent = `รวม ${photos.length} รูปจากทุกเรื่องราวของเรา`;

            let items = [...photos];
            while (items.length < MIN_ITEMS) items = items.concat(photos);

            const group = items.map(p => `
                <figure>
                    <div class="photo"><img src="${p.src}" alt="${escapeHtml(p.title)}" loading="lazy"></div>
                    <figcaption>${escapeHtml(p.title)}<small>${formatDateThai(p.date)}</small></figcaption>
                </figure>`).join('');

            // ใส่ชุดเดียวกัน 2 รอบ แล้วเลื่อนไปครึ่งหนึ่ง = วนต่อเนื่องไม่สะดุด
            track.style.setProperty('--dur', (items.length * SECONDS_PER_ITEM) + 's');
            track.innerHTML = `<div class="group">${group}</div><div class="group" aria-hidden="true">${group}</div>`;
        }

        (async function init() {
            try {
                await waitForFirebase();
                const memories = await window.firestoreApi.loadMemoriesFromFirestore();
                render(collectPhotos(memories));
            } catch (e) {
                console.error(e);
                document.getElementById('subtitle').textContent = 'โหลดรูปไม่สำเร็จ: ' + e.message;
            }
        })();

        // --- เมนู / ธีม / logout (เหมือน index) ---
        function closeNavMenu() {
            const panel = document.getElementById('nav-menu-panel');
            if (!panel) return;
            panel.classList.add('hidden');
            document.getElementById('nav-menu-btn').setAttribute('aria-expanded', 'false');
        }
        function toggleNavMenu(e) {
            if (e) e.stopPropagation();
            const panel = document.getElementById('nav-menu-panel');
            const open = panel.classList.contains('hidden');
            panel.classList.toggle('hidden', !open);
            document.getElementById('nav-menu-btn').setAttribute('aria-expanded', String(open));
        }
        document.addEventListener('click', (e) => {
            const wrap = document.getElementById('nav-menu-wrap');
            if (wrap && !wrap.contains(e.target)) closeNavMenu();
        });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeNavMenu(); });

        function syncThemeUI() {
            const dark = document.documentElement.classList.contains('dark');
            const btn = document.getElementById('theme-toggle');
            if (btn) {
                const label = dark ? 'สลับเป็นโหมดสว่าง' : 'สลับเป็นโหมดมืด';
                btn.setAttribute('aria-pressed', String(dark));
                btn.setAttribute('aria-label', label);
                btn.setAttribute('title', label);
            }
            const meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', dark ? '#1F1426' : '#FFE8F1');
        }
        function toggleTheme() {
            const dark = document.documentElement.classList.toggle('dark');
            try { localStorage.setItem('theme_mode', dark ? 'dark' : 'light'); } catch (e) {}
            syncThemeUI();
        }
        function logout() {
            if (!confirm('ต้องการออกจากระบบ (ล็อกหน้านี้) ใช่ไหม?')) return;
            try { localStorage.removeItem('anniv_auth'); } catch (e) {}
            location.replace('login.html');
        }
        syncThemeUI();
        try { window.lucide && lucide.createIcons(); } catch (e) {}
    </script>
<!-- เพลงประกอบ: ใช้ไฟล์ bgm.mp3 และค่า bgm_enabled ตัวเดียวกับ index (เปิดค้างไว้ข้ามหน้า และเล่นต่อจากตำแหน่งเดิม) -->
<audio id="bgm-audio" loop preload="none">
    <source src="./bgm.mp3" type="audio/mpeg">
</audio>
<script>
(function () {
    var KEY = 'bgm_enabled', POS = 'bgm_pos';
    var audio = document.getElementById('bgm-audio');
    if (!audio) return;

    function setUI(playing) {
        var btn = document.getElementById('music-toggle');
        if (!btn) return;
        var off = btn.querySelector('.icon-music-off'), on = btn.querySelector('.icon-music-on');
        if (off) off.classList.toggle('hidden', playing);
        if (on) on.classList.toggle('hidden', !playing);
        var label = playing ? 'ปิดเพลงประกอบ' : 'เปิดเพลงประกอบ';
        btn.setAttribute('aria-pressed', String(playing));
        btn.setAttribute('aria-label', label);
        btn.setAttribute('title', label);
    }
    function savePos() {
        try { if (!audio.paused && audio.currentTime > 0) localStorage.setItem(POS, String(audio.currentTime)); } catch (e) {}
    }
    function resumeFromSaved() {
        var t = 0;
        try { t = parseFloat(localStorage.getItem(POS) || '0') || 0; } catch (e) {}
        if (t > 0) audio.addEventListener('loadedmetadata', function () {
            try { if (isFinite(audio.duration) && t < audio.duration) audio.currentTime = t; } catch (e) {}
        }, { once: true });
    }

    window.toggleMusic = function () {
        if (audio.paused) {
            resumeFromSaved();
            audio.play().then(function () {
                setUI(true);
                try { localStorage.setItem(KEY, 'on'); } catch (e) {}
            }).catch(function (err) {
                console.warn('เล่นเพลงไม่สำเร็จ (ตรวจสอบว่ามีไฟล์ bgm.mp3 หรือยัง):', err);
            });
        } else {
            savePos();
            audio.pause();
            setUI(false);
            try { localStorage.setItem(KEY, 'off'); } catch (e) {}
        }
    };

    var enabled = false;
    try { enabled = localStorage.getItem(KEY) === 'on'; } catch (e) {}
    if (enabled) {
        resumeFromSaved();
        // เบราว์เซอร์อาจบล็อก autoplay: ถ้าเล่นไม่ได้ ปุ่มจะกลับเป็นสถานะปิด (เหมือน index)
        audio.play().then(function () { setUI(true); }).catch(function () { setUI(false); });
    }
    audio.addEventListener('timeupdate', function () {
        if (Math.floor(audio.currentTime) % 3 === 0) savePos();
    });
    window.addEventListener('pagehide', savePos);
    document.addEventListener('visibilitychange', function () { if (document.hidden) savePos(); });
})();
</script>
</body>
</html>
