<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Cinema - หนังที่เราดูด้วยกัน</title>
<meta name="theme-color" content="#FFE8F1">
<script>
(function(){try{var s=localStorage.getItem('theme_mode');var d=s?s==='dark':matchMedia('(prefers-color-scheme: dark)').matches;if(d)document.documentElement.classList.add('dark');}catch(e){}})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Prompt:wght@300;400;500;600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{
  --bg:linear-gradient(150deg,#FFE8F1 0%,#FFF3E6 30%,#FFEFD9 55%,#F1E9FB 80%,#E4F6F2 100%);
  --ink:#4A3E3D; --muted:#8C7B7A; --card:rgba(255,255,255,.94);
  --line:rgba(255,111,165,.38); --edge:rgba(255,232,241,.92); --nav:rgba(255,255,255,.92);
  --pill:#FFE3EF; --pillink:#C2306F; --tog:#EDE7FB; --togink:#6D4BB3;
}
html.dark{
  --bg:linear-gradient(150deg,#1F1426 0%,#251824 30%,#241B22 55%,#1E1A2F 80%,#14232B 100%);
  --ink:#F3E8EC; --muted:#B8A7B2; --card:rgba(44,31,48,.94);
  --line:rgba(255,143,184,.34); --edge:rgba(16,9,20,.96); --nav:rgba(31,20,38,.92);
  --pill:rgba(255,111,165,.16); --pillink:#FFA3C4; --tog:rgba(255,200,69,.16); --togink:#FFD36B;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{font-family:'Poppins','Prompt',sans-serif;background:var(--bg);background-attachment:fixed;color:var(--ink)}

/* ===== Header: เหมือนหน้าหลัก (index) ===== */
.ls-nav{position:relative;z-index:40;height:64px;background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,182,193,.4)}
html.dark .ls-nav{background:rgba(31,20,38,.92);border-bottom-color:rgba(255,143,184,.25)}
.ls-nav .hidden{display:none!important}
.ls-in{position:relative;max-width:64rem;height:100%;margin:0 auto;padding:0 1rem;display:flex;align-items:center;justify-content:space-between}
.ls-deco{position:absolute;pointer-events:none;display:none}
@media (min-width:640px){.ls-deco{display:block}}
.ls-d1{top:.5rem;left:33.333%;width:.875rem;height:.875rem;color:rgba(249,168,212,.6);fill:rgba(251,207,232,.6)}
.ls-d2{bottom:.25rem;left:50%;width:.75rem;height:.75rem;color:rgba(252,211,77,.7)}
.ls-d3{top:.75rem;right:33.333%;width:.75rem;height:.75rem;color:rgba(240,171,252,.6);fill:rgba(245,208,254,.6)}
.ls-brand{display:flex;align-items:center;gap:.5rem;min-width:0;text-decoration:none;color:inherit}
.ls-logo{position:relative;flex:none;width:2.5rem;height:2.5rem;border-radius:50%;background:#fce7f3;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 2px 4px rgba(0,0,0,.05)}
html.dark .ls-logo{background:rgba(255,111,165,.16)}
.ls-heart{width:1.5rem;height:1.5rem;fill:#f472b6;stroke:#ec4899}
.ls-spark{position:absolute;top:-4px;right:-4px;width:1rem;height:1rem;border-radius:50%;background:#fcd34d;display:flex;align-items:center;justify-content:center;font-size:9px;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.ls-ttl{min-width:0;overflow:hidden}
.ls-ttl h1{font:700 1.25rem/1.25 'Mitr',sans-serif;white-space:nowrap;background:linear-gradient(90deg,#ec4899,#d946ef,#f59e0b);-webkit-background-clip:text;background-clip:text;color:transparent}
.ls-ttl p{font:300 .75rem/1rem 'Prompt',sans-serif;color:#f472b6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes heartPulse{0%{transform:scale(1)}14%{transform:scale(1.15)}28%{transform:scale(1)}42%{transform:scale(1.15)}70%{transform:scale(1)}}
.animate-heart-pulse{animation:heartPulse 2.5s infinite}
.ls-acts{display:flex;align-items:center;gap:.5rem;flex:none}
.ls-menuwrap{position:relative}
.ls-menubtn{position:relative;height:2.25rem;padding:0 .875rem;display:inline-flex;align-items:center;gap:.375rem;border:0;border-radius:9999px;background:#fce7f3;color:#be185d;font:500 .875rem 'Prompt',sans-serif;white-space:nowrap;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.05);transition:background .2s}
.ls-menubtn:hover{background:#fbcfe8}
.ls-menubtn .ls-ic{color:#ec4899}
.ls-menubtn #nav-menu-chevron{width:.875rem;height:.875rem;color:#f472b6;transition:transform .2s}
#nav-menu-btn[aria-expanded="true"] #nav-menu-chevron{transform:rotate(180deg)}
html.dark .ls-menubtn{background:rgba(255,111,165,.16);color:#FFA3C4}
html.dark .ls-menubtn:hover{background:rgba(255,111,165,.28)}
.ls-ic{width:1rem;height:1rem;flex:none}
.ls-panel{position:absolute;right:0;top:100%;margin-top:.5rem;width:16rem;padding:.5rem;border-radius:1rem;display:flex;flex-direction:column;gap:.375rem;z-index:50;
  background:rgba(255,255,255,.88);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid rgba(255,182,193,.35);
  box-shadow:0 20px 25px -5px rgba(0,0,0,.1),0 8px 10px -6px rgba(0,0,0,.1);animation:navMenuIn .16s ease-out}
html.dark .ls-panel{background:rgba(44,31,48,.9);border-color:rgba(255,143,184,.22);box-shadow:0 10px 30px rgba(0,0,0,.35)}
@keyframes navMenuIn{from{opacity:0;transform:translateY(-6px) scale(.97)}to{opacity:1;transform:none}}
.ls-item{display:flex;align-items:center;gap:.625rem;width:100%;padding:.55rem .9rem;border-radius:9999px;white-space:nowrap;font:500 .875rem 'Prompt',sans-serif;text-align:left;text-decoration:none;border:0;cursor:pointer;
  background:var(--ib);color:var(--it);transition:background .2s,filter .2s}
.ls-item:hover{background:var(--ibh,var(--ib));filter:var(--ihf,none)}
.ls-item .ls-ic{color:var(--ii)}
.ls-item[aria-current="page"]{box-shadow:inset 0 0 0 2px rgba(255,111,165,.55)}
.ls-rose{--ib:#ffe4e6;--ibh:#fbcfe8;--it:#be123c;--ii:#f43f5e}
.ls-rose2{--ib:#ffe4e6;--ibh:#fecdd3;--it:#be123c;--ii:#f43f5e}
.ls-pink{--ib:#fce7f3;--ibh:#fbcfe8;--it:#be185d;--ii:#ec4899}
.ls-fuchsia{--ib:#fae8ff;--it:#a21caf;--ii:#d946ef;--ihf:brightness(.95)}
.ls-purple{--ib:#f3e8ff;--it:#9333ea;--ii:#a855f7;--ihf:brightness(.95)}
.ls-amber{--ib:#fef3c7;--ibh:#fde68a;--it:#92400e;--ii:#f59e0b}
.ls-sky{--ib:#e0f2fe;--ibh:#bae6fd;--it:#0369a1;--ii:#0ea5e9}
html.dark .ls-rose,html.dark .ls-pink{--ib:rgba(255,111,165,.16);--ibh:rgba(255,111,165,.28);--it:#FFA3C4}
html.dark .ls-rose2{--ib:rgba(255,111,165,.16);--ibh:rgba(255,111,165,.28);--it:#FFA3C4}
html.dark .ls-fuchsia{--ib:rgba(217,70,239,.18);--it:#EC94F2}
html.dark .ls-purple{--ib:rgba(168,85,247,.2);--it:#C7A2F4}
html.dark .ls-amber{--ib:rgba(255,200,69,.16);--ibh:rgba(255,200,69,.28);--it:#FFD98A}
html.dark .ls-sky{--ib:rgba(14,165,233,.18);--ibh:rgba(14,165,233,.3);--it:#6DD3F0}
.ls-tog{width:2.25rem;height:2.25rem;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:9999px;background:#EDE7FB;color:#6D4BB3;cursor:pointer;
  box-shadow:0 1px 2px rgba(0,0,0,.08);transition:background .2s,color .2s,transform .2s}
.ls-tog:hover{background:#E1D7F8}
.ls-tog:active{transform:scale(.92)}
.ls-tog .icon-sun{display:none}
html.dark .ls-tog{background:rgba(255,200,69,.16);color:#FFD36B}
html.dark .ls-tog:hover{background:rgba(255,200,69,.28)}
html.dark .ls-tog .icon-sun{display:block}
html.dark .ls-tog .icon-moon{display:none}
.ls-logout{background:#FFE3EA;color:#D9304F}
.ls-logout:hover{background:#FFD0DB}
html.dark .ls-logout{background:rgba(255,138,159,.16);color:#FF8A9F}
html.dark .ls-logout:hover{background:rgba(255,138,159,.28)}
.ls-menubtn:focus-visible,.ls-tog:focus-visible,.ls-item:focus-visible,.ls-brand:focus-visible{outline:2px solid #A374DB;outline-offset:2px}
@media (prefers-reduced-motion:reduce){.ls-panel,.animate-heart-pulse{animation:none}.ls-tog,.ls-menubtn,.ls-item{transition:none}}

/* ฉาก: ทางเดินแกลเลอรี 3 มิติ */
#stage{position:relative;height:calc(100svh - 64px);overflow:hidden;perspective:1100px;perspective-origin:50% 46%;touch-action:none;cursor:grab}
#stage:active{cursor:grabbing}
#floor{position:absolute;left:-60%;right:-60%;bottom:0;height:48%;transform-origin:50% 100%;transform:perspective(700px) rotateX(64deg);
  background:repeating-linear-gradient(0deg,var(--line) 0 2px,transparent 2px 90px);
  -webkit-mask-image:linear-gradient(to top,#000 25%,transparent);mask-image:linear-gradient(to top,#000 25%,transparent)}
#fog{position:absolute;inset:0;pointer-events:none;z-index:5;background:radial-gradient(ellipse at 50% 46%,transparent 28%,var(--edge) 100%)}
#world{position:absolute;left:50%;top:46%;width:0;height:0;transform-style:preserve-3d}

.frame{position:absolute;left:0;top:0;width:290px;padding:10px 10px 13px;background:var(--card);border:2px solid var(--c);border-radius:14px;
  box-shadow:0 0 26px color-mix(in srgb,var(--c) 45%,transparent);transition:box-shadow .35s}
.frame.on{box-shadow:0 0 46px color-mix(in srgb,var(--c) 85%,transparent)}
.poster{position:relative;aspect-ratio:2/3;border-radius:8px;overflow:hidden;display:grid;place-items:center;text-align:center;padding:14px;
  background:linear-gradient(160deg,var(--c),color-mix(in srgb,var(--c) 35%,#3b2a3a));color:#fff}
.poster span{font:500 20px/1.3 'Poppins','Mitr',sans-serif;text-shadow:0 2px 8px rgba(0,0,0,.25)}
.poster span i{display:block;font-style:normal;font-size:34px;margin-bottom:6px}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cap{padding:10px 4px 0}
.cap small{font-size:12px;color:var(--c);font-weight:500}
.cap h3{font:500 18px/1.3 'Poppins','Mitr',sans-serif;margin:2px 0 4px}
.cap .d{font-size:12px;color:var(--muted);margin-bottom:6px}
.cap p{font-size:13px;line-height:1.7;font-weight:300}

.sign{position:absolute;left:0;top:0;text-align:center;white-space:nowrap;pointer-events:none}
.sign b{display:block;font:600 clamp(44px,8vw,92px)/1.15 'Poppins','Mitr',sans-serif;letter-spacing:-.02em;background:linear-gradient(90deg,#FF6FA5,#FF9F5A,#FFC845);-webkit-background-clip:text;background-clip:text;color:transparent;padding:0 .15em}
.sign span{font:400 clamp(14px,2vw,18px) 'Poppins','Prompt',sans-serif;color:var(--muted)}

#ctl{position:absolute;left:0;right:0;bottom:22px;z-index:6;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
#pad{display:flex;align-items:center;gap:16px;pointer-events:auto}
.wbtn{width:64px;height:64px;border-radius:50%;border:1.5px solid #FF6FA5;background:var(--card);color:#FF6FA5;
  font:500 11px 'Poppins','Prompt',sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  box-shadow:0 0 22px rgba(255,111,165,.4)}
.wbtn.fwd{width:80px;height:80px;font-size:13px}
.wbtn svg{width:22px;height:22px}
.wbtn.go{background:#FF6FA5;color:#fff}
.wbtn:focus-visible{outline:2px solid #A374DB;outline-offset:2px}
#hint{font-size:12px;color:var(--muted)}

@media (max-width:640px){
  .frame{width:210px;padding:8px 8px 10px}
  .poster span{font-size:16px}
  .cap h3{font-size:15px} .cap p{font-size:11.5px;line-height:1.6}
}
</style>
</head>
<body>
<header class="ls-nav">
  <i data-lucide="heart" class="ls-deco ls-d1"></i>
  <i data-lucide="sparkles" class="ls-deco ls-d2"></i>
  <i data-lucide="heart" class="ls-deco ls-d3"></i>
  <div class="ls-in">
    <a href="index.html" class="ls-brand" aria-label="กลับหน้าแรก Our Love Story">
      <div class="ls-logo">
        <i data-lucide="heart" class="ls-heart animate-heart-pulse"></i>
        <span class="ls-spark">✨</span>
      </div>
      <div class="ls-ttl">
        <h1>Our Love Story</h1>
        <p>เส้นทางความทรงจำของเราสองคน</p>
      </div>

    <div class="ls-acts">

          <i data-lucide="layout-grid" class="ls-ic"></i>

        <div id="nav-menu-panel" role="menu" class="ls-panel hidden">

        <a href="map.html" role="menuitem" class="ls-item ls-pink"><i data-lucide="map" class="ls-ic"></i><span>แผนที่ความทรงจำ</span></a>
        <a href="marquee.html" role="menuitem" class="ls-item ls-fuchsia"><i data-lucide="images" class="ls-ic"></i><span>แกลเลอรีรูป</span></a>

        <a href="puzzle.html" role="menuitem" class="ls-item ls-amber"><i data-lucide="puzzle" class="ls-ic"></i><span>จิ๊กซอว์</span></a>
        <a href="anniversary.html" role="menuitem" class="ls-item ls-sky"><i data-lucide="film" class="ls-ic"></i><span>วิดีโอครบรอบ</span></a>
        <a href="index.html?open=random" role="menuitem" class="ls-item ls-amber"><i data-lucide="sparkles" class="ls-ic"></i><span>สุ่มความทรงจำ</span></a>
        <a href="index.html?open=onthisday" role="menuitem" class="ls-item ls-rose2"><i data-lucide="history" class="ls-ic"></i><span>วันนี้เมื่อปีก่อน</span></a>
        </div>
      </div>
      <button id="music-toggle" type="button" onclick="toggleMusic()" class="ls-tog" aria-pressed="false" aria-label="เปิดเพลงประกอบ" title="เปิด/ปิดเพลงประกอบ">
        <i data-lucide="music" class="icon-music-off ls-ic"></i>
        <i data-lucide="volume-2" class="icon-music-on ls-ic hidden"></i>
      </button>
      <button id="theme-toggle" type="button" onclick="toggleTheme()" class="ls-tog" aria-pressed="false" aria-label="สลับเป็นโหมดมืด" title="สลับเป็นโหมดมืด">
        <i data-lucide="moon" class="icon-moon ls-ic"></i>
        <i data-lucide="sun" class="icon-sun ls-ic"></i>
      </button>
      <button id="logout-btn" type="button" onclick="logout()" class="ls-tog ls-logout" aria-label="ออกจากระบบ" title="ออกจากระบบ (ล็อก)">
        <i data-lucide="log-out" class="ls-ic"></i>
      </button>

  </div>
</header>

<main id="stage">
  <div id="floor"></div>
  <div id="world"></div>
  <div id="fog"></div>
  <div id="ctl">
    <div id="pad">
      <button id="back" class="wbtn" type="button" aria-label="กดค้างเพื่อถอยหลัง"><i data-lucide="arrow-down"></i>ถอยหลัง</button>
      <button id="fwd" class="wbtn fwd" type="button" aria-label="กดค้างเพื่อเดินหน้า"><i data-lucide="arrow-up"></i>เดินหน้า</button>
    </div>
    <div id="hint">กดค้างปุ่มเดินหน้า / ถอยหลัง หรือลากนิ้วขึ้น-ลงบนจอ</div>
  </div>
</main>

<script>
/* ===== แก้รายการหนังตรงนี้ =====
   t = ชื่อเรื่อง, d = วันที่ดู, n = ข้อความความทรงจำ, c = สีกรอบ,
   y = ปีที่หนังออก (ไม่บังคับ ช่วยให้ค้นเจอเรื่องที่ถูก), id = รหัส IMDb เช่น 'tt3896198' (ไม่บังคับ แม่นที่สุด),
   p = ที่อยู่ไฟล์โปสเตอร์ เช่น 'posters/lalaland.jpg' (ใส่แล้วจะใช้รูปนี้แทน OMDb)
   ตัวอย่างด้านล่างเป็นข้อมูลตัวอย่าง ให้เปลี่ยนเป็นเรื่องจริงของเรา */
/* ===== OMDb: ดึงโปสเตอร์อัตโนมัติจากชื่อเรื่อง (omdbapi.com) ===== */
const OMDB_KEY = 'dafc860d';

const films = [
  { t:'La La Land', y:'2016', d:'14 ก.พ. 2025', n:'หนังเรื่องแรกที่ดูด้วยกันในโรง ป๊อปคอร์นหมดก่อนหนังเริ่ม', c:'#FF6FA5', p:'' },
  { t:'Your Name', y:'2016', d:'2 มี.ค. 2025', n:'ร้องไห้พร้อมกัน แล้วหัวเราะกันเองตอนเดินออกมา', c:'#5AC8E8', p:'' },
  { t:'Spider-Man: Across the Spider-Verse', y:'2023', d:'19 เม.ย. 2025', n:'ที่นั่งแถวเดิมที่เราชอบ และเธอบ่นว่าเสียงดังไป', c:'#FF9F5A', p:'' },
  { t:'Interstellar', y:'2014', d:'8 มิ.ย. 2025', n:'นั่งนิ่งสามชั่วโมง แล้วคุยต่อกันอีกสองชั่วโมง', c:'#A374DB', p:'' },
  { t:'Past Lives', y:'2023', d:'30 ส.ค. 2025', n:'เดินกลับบ้านเงียบๆ แต่จับมือแน่นกว่าเดิม', c:'#FFC845', p:'' },
  { t:'Coco', y:'2017', d:'25 ธ.ค. 2025', n:'หนังที่ดูที่บ้าน ห่มผ้าผืนเดียวกัน', c:'#5ED1A6', p:'' }
];

const GAP = 520, Z0 = 700, END = films.length * GAP + 200;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const world = document.getElementById('world'), floor = document.getElementById('floor'), stage = document.getElementById('stage');
const esc = s => s.replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const items = [];

function showPoster(box, url, title) {
  const hi = url.replace(/_SX\d+/, '_SX700');          // OMDb ให้รูป 300px ลองขอขนาดใหญ่ขึ้นก่อน
  const tries = hi !== url ? [hi, url] : [url];
  const next = () => {
    const u = tries.shift(); if (!u) return;            // ไม่ได้สักรูป: คงโปสเตอร์สีไว้
    const img = new Image();
    img.alt = 'โปสเตอร์ ' + title;
    img.onload = () => box.appendChild(img);
    img.onerror = next;
    img.src = u;
  };
  next();
}

async function omdbPoster(f) {
  const ck = 'omdb_poster_v1:' + (f.id || f.t + '|' + (f.y || ''));
  try { const c = localStorage.getItem(ck); if (c) return c; } catch (e) {}
  const q = f.id ? 'i=' + encodeURIComponent(f.id)
    : 't=' + encodeURIComponent(f.t) + '&type=movie' + (f.y ? '&y=' + f.y : '');
  try {
    const r = await fetch('https://www.omdbapi.com/?' + q + '&apikey=' + OMDB_KEY);
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    if (j.Response === 'False') throw new Error(j.Error);
    if (!j.Poster || j.Poster === 'N/A') return '';
    try { localStorage.setItem(ck, j.Poster); } catch (e) {}
    return j.Poster;
  } catch (e) { console.warn('OMDb:', f.t, e); return ''; }
}

function add(el, z, i) { world.appendChild(el); items.push({ el, z, i }); }

const sign = document.createElement('div');
sign.className = 'sign';
sign.innerHTML = '<b>Our Cinema</b><span>หนังที่เราดูด้วยกัน เดินเข้าไปดูกันเลย</span>';
add(sign, -300, -1);

films.forEach((f, i) => {
  const el = document.createElement('article');
  el.className = 'frame';
  el.style.setProperty('--c', f.c);
  el.innerHTML =
    '<div class="poster"><span><i>🎬</i>' + esc(f.t) + '</span></div>' +
    '<div class="cap"><small>เรื่องที่ ' + (i + 1) + '</small><h3>' + esc(f.t) + '</h3><p class="d">' + esc(f.d) + '</p><p>' + esc(f.n) + '</p></div>';
  add(el, -(i * GAP + Z0), i);
  const box = el.querySelector('.poster');
  if (f.p) showPoster(box, f.p, f.t);
  else if (OMDB_KEY) omdbPoster(f).then(u => u && showPoster(box, u, f.t));
});

const end = document.createElement('div');
end.className = 'sign';
end.innerHTML = '<b style="font-size:clamp(30px,5.5vw,60px)">To be continued</b><span>เรื่องต่อไป เรายังไม่ได้ดูด้วยกัน</span>';
add(end, -(films.length * GAP + Z0), -1);

function layout() {
  const X = Math.min(innerWidth * 0.36, 560);
  items.forEach(it => {
    if (it.i < 0) { it.el.style.transform = 'translate3d(0,' + (it.z === -300 ? -110 : 0) + 'px,' + it.z + 'px) translate(-50%,-50%)'; return; }
    const side = it.i % 2 ? 1 : -1;
    it.el.style.transform = 'translate3d(' + side * X + 'px,-20px,' + it.z + 'px) rotateY(' + (-side * 38) + 'deg) translate(-50%,-50%)';
  });
}
layout(); addEventListener('resize', layout);

let pos = 0, target = 0, dir = 0, act = -1;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const go = d => { target = clamp(target + d, 0, END); };

(function tick() {
  if (dir) go(7 * dir);
  pos += (target - pos) * (reduce ? 1 : 0.08);
  world.style.transform = 'translateZ(' + pos + 'px)';
  floor.style.backgroundPositionY = ((pos * 0.6) % 90) + 'px';
  let best = -1, bd = 1e9;
  items.forEach(it => {
    const e = it.z + pos;
    let o = 1;
    if (e > -60) o = 1 - (e + 60) / 260; else if (e < -2400) o = (3200 + e) / 800;
    o = clamp(o, 0, 1);
    it.el.style.opacity = o;
    it.el.style.visibility = o ? 'visible' : 'hidden';
    if (it.i >= 0) { const d = Math.abs(e + 500); if (d < bd) { bd = d; best = it.i; } }
  });
  if (bd > 300) best = -1;
  if (best !== act) {
    items.forEach(it => it.i >= 0 && it.el.classList.toggle('on', it.i === best));
    act = best;
  }
  requestAnimationFrame(tick);
})();

/* ควบคุม: ปุ่มเดิน, ล้อเมาส์, ลากนิ้ว, คีย์บอร์ด */
const btns = { fwd: document.getElementById('fwd'), back: document.getElementById('back') };
function setDir(d) { dir = d; btns.fwd.classList.toggle('go', d > 0); btns.back.classList.toggle('go', d < 0); }
[[btns.fwd, 1], [btns.back, -1]].forEach(([b, d]) => {
  b.addEventListener('pointerdown', e => { e.stopPropagation(); b.setPointerCapture(e.pointerId); setDir(d); });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => b.addEventListener(ev, () => setDir(0)));
  b.addEventListener('contextmenu', e => e.preventDefault());
});
let lastY = null;
stage.addEventListener('pointerdown', e => { lastY = e.clientY; });
stage.addEventListener('pointermove', e => { if (lastY === null) return; go((lastY - e.clientY) * 2.2); lastY = e.clientY; });
['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => stage.addEventListener(ev, () => { lastY = null; }));
stage.addEventListener('wheel', e => { e.preventDefault(); go(e.deltaY * 1.1); }, { passive: false });
addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('header')) return;
  if (e.key === 'ArrowUp' || e.key === 'ArrowRight' || e.key === 'w') go(170);
  else if (e.key === 'ArrowDown' || e.key === 'ArrowLeft' || e.key === 's') go(-170);
  else if (e.key === ' ') { e.preventDefault(); setDir(1); }
});
addEventListener('keyup', e => { if (e.key === ' ') setDir(0); });

/* ===== เมนู / ธีม / logout / เพลง (เหมือน index) ===== */
function closeNavMenu() {
  const panel = document.getElementById('nav-menu-panel');
  if (!panel) return;
  panel.classList.add('hidden');
  document.getElementById('nav-menu-btn').setAttribute('aria-expanded', 'false');
}
function toggleNavMenu(e) {
  if (e) e.stopPropagation();
  const panel = document.getElementById('nav-menu-panel');
  const open = panel.classList.contains('hidden');
  panel.classList.toggle('hidden', !open);
  document.getElementById('nav-menu-btn').setAttribute('aria-expanded', String(open));
}
document.addEventListener('click', (e) => {
  const wrap = document.getElementById('nav-menu-wrap');
  if (wrap && !wrap.contains(e.target)) closeNavMenu();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeNavMenu(); });

function syncThemeUI() {
  const dark = document.documentElement.classList.contains('dark');
  const btn = document.getElementById('theme-toggle');
  if (btn) {
    const label = dark ? 'สลับเป็นโหมดสว่าง' : 'สลับเป็นโหมดมืด';
    btn.setAttribute('aria-pressed', String(dark));
    btn.setAttribute('aria-label', label);
    btn.setAttribute('title', label);
  }
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', dark ? '#1F1426' : '#FFE8F1');
}
/* สลับธีม ใช้ค่าเดียวกับหน้าหลัก (theme_mode) */
function toggleTheme() {
  const dark = document.documentElement.classList.toggle('dark');
  try { localStorage.setItem('theme_mode', dark ? 'dark' : 'light'); } catch (e) {}
  syncThemeUI();
}
function logout() {
  if (!confirm('ต้องการออกจากระบบ (ล็อกหน้านี้) ใช่ไหม?')) return;
  try { localStorage.removeItem('anniv_auth'); } catch (e) {}
  location.replace('login.html');
}
syncThemeUI();
lucide.createIcons();
</script>
<!-- เพลงประกอบ: ใช้ไฟล์ bgm.mp3 และค่า bgm_enabled ตัวเดียวกับ index (เปิดค้างไว้ข้ามหน้า และเล่นต่อจากตำแหน่งเดิม) -->
<audio id="bgm-audio" loop preload="none">
    <source src="./bgm.mp3" type="audio/mpeg">
</audio>
<script>
(function () {
    var KEY = 'bgm_enabled', POS = 'bgm_pos';
    var audio = document.getElementById('bgm-audio');
    if (!audio) return;

    function setUI(playing) {
        var btn = document.getElementById('music-toggle');
        if (!btn) return;
        var off = btn.querySelector('.icon-music-off'), on = btn.querySelector('.icon-music-on');
        if (off) off.classList.toggle('hidden', playing);
        if (on) on.classList.toggle('hidden', !playing);
        var label = playing ? 'ปิดเพลงประกอบ' : 'เปิดเพลงประกอบ';
        btn.setAttribute('aria-pressed', String(playing));
        btn.setAttribute('aria-label', label);
        btn.setAttribute('title', label);
    }
    function savePos() {
        try { if (!audio.paused && audio.currentTime > 0) localStorage.setItem(POS, String(audio.currentTime)); } catch (e) {}
    }
    function resumeFromSaved() {
        var t = 0;
        try { t = parseFloat(localStorage.getItem(POS) || '0') || 0; } catch (e) {}
        if (t > 0) audio.addEventListener('loadedmetadata', function () {
            try { if (isFinite(audio.duration) && t < audio.duration) audio.currentTime = t; } catch (e) {}
        }, { once: true });
    }

    window.toggleMusic = function () {
        if (audio.paused) {
            resumeFromSaved();
            audio.play().then(function () {
                setUI(true);
                try { localStorage.setItem(KEY, 'on'); } catch (e) {}
            }).catch(function (err) {
                console.warn('เล่นเพลงไม่สำเร็จ (ตรวจสอบว่ามีไฟล์ bgm.mp3 หรือยัง):', err);
            });
        } else {
            savePos();
            audio.pause();
            setUI(false);
            try { localStorage.setItem(KEY, 'off'); } catch (e) {}
        }
    };

    var enabled = false;
    try { enabled = localStorage.getItem(KEY) === 'on'; } catch (e) {}
    if (enabled) {
        resumeFromSaved();
        // เบราว์เซอร์อาจบล็อก autoplay: ถ้าเล่นไม่ได้ ปุ่มจะกลับเป็นสถานะปิด (เหมือน index)
        audio.play().then(function () { setUI(true); }).catch(function () { setUI(false); });
    }
    audio.addEventListener('timeupdate', function () {
        if (Math.floor(audio.currentTime) % 3 === 0) savePos();
    });
    window.addEventListener('pagehide', savePos);
    document.addEventListener('visibilitychange', function () { if (document.hidden) savePos(); });
})();
</script>
</body>
</html>
